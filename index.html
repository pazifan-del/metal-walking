<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="METALおみくじ">
  <title>⚡ METAL OMIKUJI ⚡</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-512.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ══ HEADER ══ -->
  <div id="header">
    <div id="app-title">⚡ METAL OMIKUJI ⚡</div>
    <div id="header-sub">1日1回 鋼鉄のおみくじ</div>
  </div>

  <!-- ══ MAIN SCREEN ══ -->
  <main id="screen-main" class="screen active">

    <!-- レア度バー -->
    <div id="fortune-rarity-bar">
      <span id="fortune-stars"></span>
      <span id="fortune-rarity-label"></span>
    </div>

    <!-- キャラ画像 -->
    <div id="char-wrap">
      <div id="fire-overlay"></div>
      <img id="char-img" src="" alt="character" data-char-id="">
    </div>

    <!-- キャラ名バー -->
    <div id="char-info">
      <div id="char-name-display">-</div>
      <div id="char-title-display">-</div>
    </div>

    <!-- 運勢セクション -->
    <div id="fortune-section">
      <div id="fortune-level-wrap">
        <span id="fortune-level">-</span>
      </div>
      <div id="fortune-ratings">
        <div class="fortune-row">
          <span class="fr-label">リフ運</span>
          <span class="fr-stars" id="fr-rif"></span>
        </div>
        <div class="fortune-row">
          <span class="fr-label">ヘドバン度</span>
          <span class="fr-stars" id="fr-headbang"></span>
        </div>
        <div class="fortune-row">
          <span class="fr-label">練習運</span>
          <span class="fr-stars" id="fr-practice"></span>
        </div>
        <div class="fortune-row">
          <span class="fr-label">ライブ運</span>
          <span class="fr-stars" id="fr-live"></span>
        </div>
      </div>
      <div id="fortune-quote"></div>
    </div>

    <!-- ライブモード -->
    <div id="live-mode-wrap">
      <button id="live-mode-btn">🎸 今日ライブあり</button>
    </div>

    <!-- 泣きの1回 -->
    <div id="nakino-wrap">
      <button id="nakino-btn">😭 泣きの1回</button>
      <div id="nakino-used">今日の再引きは使いました</div>
    </div>

  </main>

  <!-- ══ ZUKAN SCREEN ══ -->
  <section id="screen-zukan" class="screen">
    <div class="zukan-header">📖 METAL ZUKAN — 鋼鉄の図鑑</div>
    <div id="zukan-grid"></div>
  </section>

  <!-- ══ HISTORY SCREEN ══ -->
  <section id="screen-history" class="screen">
    <div class="history-header">📜 FORTUNE HISTORY — 運勢履歴</div>
    <div id="history-list"></div>
  </section>

  <!-- ══ BOTTOM NAV ══ -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-screen="main">
      <span class="nav-icon">🎴</span>今日
    </button>
    <button class="nav-btn" data-screen="zukan">
      <span class="nav-icon">📖</span>図鑑
    </button>
    <button class="nav-btn" data-screen="history">
      <span class="nav-icon">📜</span>履歴
    </button>
  </nav>

</div><!-- #app -->

<!-- ══ STORY EVENT OVERLAY ══ -->
<div id="event-overlay">
  <div id="event-title"></div>
  <img id="event-char-preview" src="" alt="" style="display:none">
  <div id="event-desc"></div>
  <button id="event-close-btn">— 閉じる —</button>
</div>

<!-- ══ CHARACTER DETAIL MODAL ══ -->
<div id="char-modal">
  <div id="modal-img-wrap">
    <img id="modal-stand-img" class="modal-img selected" src="" alt="stand">
    <img id="modal-action-img" class="modal-img" src="" alt="action">
  </div>
  <div id="modal-name"></div>
  <div id="modal-title"></div>
  <div id="modal-amp"></div>
  <div id="modal-quote"></div>
  <div id="modal-unlock"></div>
  <button id="modal-close">✕ 閉じる</button>
</div>

<!-- ══ DEBUG PANEL ══ -->
<div id="debug-panel">
  <div style="font-size:6px;color:#0f0;margin-bottom:4px">▶ DEBUG</div>
  <button class="dbg-btn" id="dbg-redraw">おみくじ再抽選</button>
  <button class="dbg-btn danger" id="dbg-reset">RESET</button>
</div>

<script src="js/app.js?v=17"></script>
</body>
</html>
